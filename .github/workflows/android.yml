name: Armar app Android

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'store/**', '*.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: APK de prueba (para instalar directo en el celular)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: seriefilos-prueba-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Preparar la llave de firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "No hay llave de firma cargada: solo se arma el APK de prueba."
          fi

      - name: Paquete firmado para Google Play (AAB)
        if: steps.firma.outputs.ok == '1'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: steps.firma.outputs.ok == '1'
        with:
          name: seriefilos-google-play-aab
          path: android/app/build/outputs/bundle/release/*.aab

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Seriéfilos</title>
<link rel="icon" href="icon.svg">
<style>
/* Seriéfilos: pagá solo lo que ves. Tema "Marquesina": sala oscura y acento amarillo de cartel de cine. */
@font-face{font-family:'Space Grotesk';font-weight:700 800;font-display:swap;src:url(fonts/space-grotesk-700.woff2) format('woff2')}
:root{color-scheme:dark;--bg:#0b0b0c;--card:#17171a;--soft:#222226;--ink:#f4f4f5;--mut:#a6a6ae;--line:#2a2a2f;--ac:#0b0b0c;--ac2:#2a2a2f;--btn:#ffd23f;--btnink:#111;--amb:#ffd23f;--amb2:#ffd23f;--ok:#7ee2a8;--bad:#ff7d8a;--focus:#ffd23f;--disp:'Space Grotesk',system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom));overflow-x:clip}
h1,h2,h3{line-height:1.15;margin:0;text-wrap:balance;font-family:var(--disp);font-weight:700}h2{font-size:20px}h3{font-size:17px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input[type=checkbox]{accent-color:var(--btn)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:inherit}
.top{background:var(--ac);color:var(--ink);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;gap:10px}
.top h1{font-size:22px;flex:1;letter-spacing:-.01em;font-weight:800}.top h1 b{color:var(--amb)}
.top .ib{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;min-width:44px;min-height:44px;font-size:18px}
.hero{background:var(--ac);color:#fff;padding:4px 18px 24px}
.hero small{color:var(--mut)}.big{font:800 44px/1.05 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero p{margin:6px 0 0;color:var(--mut);font-size:14px}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.hint{color:var(--mut);font-size:14px;margin:4px 0 10px}
.mut{color:var(--mut)}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.tag{display:inline-block;background:var(--ac2);color:var(--ink);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;vertical-align:middle}
.tag.amb{background:var(--amb);color:#111}.tag.red{background:var(--bad);color:#111}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.x{background:transparent;border:0;color:var(--mut);font-size:22px;min-width:40px;min-height:40px;border-radius:8px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
input,select{font-size:16px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;background:var(--card);color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.form .w{grid-column:1/-1}
.it{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;background:var(--card)}
.it h3{flex:1}.ith{display:flex;align-items:center;gap:8px}
.price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sep{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row>span{flex:1}
.row input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--btn)}
.alert{background:#1f1a08;border:1px solid #4d3f0c;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.alert p{margin:0}
.verd{border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--soft)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-decoration:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;font-size:11.5px;min-height:56px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current=page]{color:var(--ink);font-weight:700}nav.tabs a[aria-current=page] svg{color:var(--amb2)}
.res{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--card);width:100%;text-align:left}
.res img{width:42px;height:60px;object-fit:cover;border-radius:6px;background:var(--soft);flex:none}
.empty{text-align:center;color:var(--mut);padding:18px 6px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a2a2f;color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal>div{background:var(--card);border-radius:16px;padding:18px;max-width:420px;width:100%}
details summary{cursor:pointer;color:var(--mut);font-size:14px}
s{color:var(--mut);font-weight:400}
.pst{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid #ffffff14}
.pst img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pst>span{position:absolute;left:8px;right:8px;bottom:8px;font:700 13px/1.15 var(--disp);color:var(--ink);overflow-wrap:anywhere}
.pst>em{position:absolute;top:6px;left:6px;max-width:calc(100% - 12px);background:#000c;color:var(--ink);border-radius:6px;padding:1px 6px;font:600 10.5px/1.5 system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.seg a{flex:1;text-align:center;text-decoration:none;padding:9px 0;border-radius:9px;font-weight:700;font-size:14px;color:var(--mut)}
.seg a[aria-current=page]{background:var(--amb);color:#111}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.srch{flex:1;flex-direction:row;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;color:var(--mut)}
.srch input{flex:1;border:0;background:transparent;padding:0;min-height:42px}.srch input:focus{outline:none}.srch:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:36px}
.chip[aria-pressed=true]{background:var(--amb);color:#111;border-color:var(--amb)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 0 10px}.sh b{font-size:14px;color:var(--mut);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px}
.gi{text-decoration:none;color:var(--ink);display:block}.gi small{display:block;color:var(--mut);font-size:12px;line-height:1.3;margin-top:6px}
.bar{height:4px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:5px}.bar i{display:block;height:4px;background:var(--amb)}
.det{display:flex;gap:14px;margin:6px 0 14px}.det>.pst{width:100px;flex:none}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mut);text-decoration:none;min-height:44px;font-size:15px;margin:-6px 0 4px -6px;padding-right:8px}
.eps label{flex-direction:row;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);font-size:15px}
.eps label:first-child{border-top:0}.eps label span{flex:1}.eps label small{color:var(--mut);font-size:13px}.eps label.fut span{color:var(--mut)}
.eps input{width:22px;height:22px;min-height:0;margin:0;flex:none;padding:0}
.dsec{margin-bottom:18px}.dsec .hint{margin:2px 0 10px}
.hrow{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}.hrow>div{width:104px;flex:none}
.meta{display:flex;align-items:flex-start;gap:4px;margin-top:6px}.meta small{flex:1;color:var(--mut);font-size:12px;line-height:1.3}
.hrow>div>a{display:block;color:inherit;text-decoration:none}
.add{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--amb);display:flex;align-items:center;justify-content:center;padding:0;flex:none}.add:disabled{color:var(--ok);cursor:default}
.hero2{position:relative;height:196px;border-radius:14px;overflow:hidden;background:var(--soft) center 22%/cover no-repeat;border:1px solid #ffffff14;display:flex;flex-direction:column;justify-content:space-between;padding:12px 14px}
.hero2:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 25%,#000000e6)}
.hero2>*{position:relative}.hero2 .tag{align-self:flex-start}
.hb{display:flex;align-items:flex-end;gap:12px}.hb p{margin:2px 0 0;font-size:14px;color:#d4d4d8}
.cd{text-align:center;background:#000000b3;border-radius:12px;padding:6px 10px}.cd b{display:block;font:800 26px/1 var(--disp);color:var(--amb)}.cd small{font-size:11px;color:#d4d4d8}
.srow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.srow:first-child{border-top:0}.srow>.pst{width:64px;flex:none;align-self:flex-start}.srow>.pst>span{font-size:10px;left:5px;right:5px;bottom:5px;overflow-wrap:break-word}
.alp{display:flex;gap:12px;align-items:flex-start}.alp>.pst{width:48px;flex:none}.alp>.pst>span{display:none}.alp>div{flex:1;min-width:0}
.prow{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.prow>a{width:56px;flex:none}.prow .pst>span{font-size:9px;left:4px;right:4px;bottom:4px;overflow-wrap:normal;hyphens:auto}
.card .hrow{margin:8px -16px 0}.hrow>a.gi{width:96px;flex:none}
.mono{width:44px;height:44px;border-radius:10px;background:var(--soft);border:1px solid var(--line);color:var(--amb);display:flex;align-items:center;justify-content:center;font:800 15px/1 var(--disp);flex:none}
.foot{font-size:13px;color:var(--mut);text-align:center;margin:20px 0 6px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top"><h1>Serié<b>filos</b></h1><button class="ib" data-go="ajustes" aria-label="Ajustes">⚙</button></header>
<div id="hero"></div>
<main id="view"></main>
<nav class="tabs" aria-label="Secciones">
 <a href="#inicio" data-r="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
 <a href="#plataformas" data-r="plataformas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Plataformas</a>
 <a href="#paraver" data-r="paraver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14v17l-7-4-7 4z"/></svg>Para ver</a>
 <a href="#series" data-r="series"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>En espera</a>
 <a href="#promos" data-r="promos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Promos</a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ===== configuración ===== */
const CAT_URL='https://raw.githubusercontent.com/aleknot696/Seriefilos/main/docs/catalogo.json';
const KEY='seriefilos:v1',KCAT='seriefilos:cat';
const VERSION='1.0.0';
/* ===== utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const fmt=v=>'$\u00a0'+nf.format(Math.round(+v||0));
const pn=s=>{const v=String(s??'').replace(/[^\d-]/g,'');return v&&v!=='-'?parseInt(v,10):0};
const uid=()=>Math.random().toString(36).slice(2,9);
const MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const nowK=()=>today().slice(0,7);
const lab=k=>{const[y,m]=k.split('-');return MN[m-1]+' '+y};
const labS=k=>{const[y,m]=k.split('-');return MN[m-1].slice(0,3)+' '+y.slice(2)};
const addM=(k,d)=>{let[y,m]=k.split('-').map(Number);m+=d;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+String(m).padStart(2,'0')};
const addD=(f,mo,dd)=>{const d=new Date(+f.slice(0,4),+f.slice(5,7)-1+(mo||0),+f.slice(8)+(dd||0));return ymd(d)};
const dObj=f=>new Date(+f.slice(0,4),+f.slice(5,7)-1,+f.slice(8));
const dias=f=>f?Math.round((dObj(f)-dObj(today()))/864e5):null;
const fDM=f=>f?+f.slice(8)+'/'+(+f.slice(5,7)):'';
const fDMY=f=>f?+f.slice(8)+'/'+(+f.slice(5,7))+'/'+f.slice(2,4):'';
const pl=(n,s,p)=>n+' '+(n===1?s:(p||s+'s'));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function ask(msg,ok){return new Promise(r=>{const m=document.createElement('div');m.className='modal';m.innerHTML='<div role="dialog" aria-modal="true"><p style="margin:0 0 14px">'+esc(msg)+'</p><div class="acts" style="justify-content:flex-end"><button class="btn ghost" data-a="0">Cancelar</button><button class="btn" data-a="1">'+esc(ok||'Aceptar')+'</button></div></div>';document.body.append(m);m.querySelector('[data-a="1"]').focus();m.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b&&e.target!==m)return;m.remove();r(!!b&&b.dataset.a==='1')})})}

/* ===== estado ===== */
const D0=()=>({subs:[],watch:[],series:[],aviso:7,avisoEstreno:7,dolarManual:0,intro:true});
let D=D0();try{D=Object.assign(D0(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
D.watch.forEach(w=>{if(!w.id)w.id=uid()});
let CAT=null;try{CAT=JSON.parse(localStorage.getItem(KCAT)||'null')}catch(e){}
const S={route:'inicio',pf:null,bj:null,nw:{t:'',svc:'',tipo:'Serie'},jw:'',ns:'',np:'',nc:{n:'',m:'',mon:'ARS'},sq:'',sres:null,sbusy:false,ssel:null,sult:'1',wq:'',wres:null,wbusy:false,wsel:null,wman:false,wf:null,det:null,ptab:'lista',dseas:null,lres:null,lbusy:false,df:null,dbusy:false,derr:false,sadd:false};
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('No se pudo guardar')}scheduleNotifs()}

/* ===== catálogo (precios y promos) ===== */
const catS=()=>(CAT&&CAT.servicios)||{};
const dolar=()=>+D.dolarManual||+(CAT&&CAT.dolar)||0;
const rec=()=>CAT&&CAT.rec!=null?+CAT.rec:51;
const toARS=(m,mon)=>mon==='USD'?m*dolar()*(1+rec()/100):m;
async function loadCat(){
  const tryJ=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;return r.json()};
  if(!CAT){try{CAT=await tryJ('catalogo.json')}catch(e){}}
  try{const c=await tryJ(CAT_URL+'?t='+Date.now());if(c&&c.servicios&&(!CAT||!CAT.mes||String(c.mes)>=String(CAT.mes))){CAT=c;localStorage.setItem(KCAT,JSON.stringify(c))}}catch(e){}
  render()}

/* ===== suscripciones ===== */
function subInfo(x){if(x.svc){const sv=catS()[x.svc],p=sv&&sv.planes&&sv.planes[x.plan];return{n:sv?sv.n:x.svc,plan:p?p.n:x.plan,m:p?+p.m||0:0,mon:sv?sv.mon:'ARS',ok:!!p}}return{n:x.n,m:+x.m||0,mon:x.mon||'ARS',ok:true}}
const subFin=x=>{const i=subInfo(x);return toARS(i.m,i.mon)};
const subHasta=x=>x.alta?addD(x.alta,1):'';
const subCorte=x=>x.rot&&x.alta?(x.hasta||subHasta(x)):'';
function subPaga(x,k){k=k||nowK();if(x.pausa)return false;if(x.rot&&x.baja&&x.alta)return x.alta.slice(0,7)===k;return true}
const promoFin=x=>x.promo&&x.promo.desde?addM(x.promo.desde,Math.max(1,+x.promo.meses||1)-1):'';
const promoAct=(x,k)=>!!(x.promo&&x.promo.desde&&k>=x.promo.desde&&k<=promoFin(x));
const promoVal=(x,p)=>p.pct?subFin(x)*(1-Math.min(100,+p.pct)/100):(+p.m||0);
const subFinK=(x,k)=>promoAct(x,k||nowK())?promoVal(x,x.promo):subFin(x);
const subTot=k=>{k=k||nowK();return D.subs.filter(x=>subPaga(x,k)).reduce((a,x)=>a+subFinK(x,k),0)};
const pfParse=v=>{v=String(v||'').trim();const n=parseFloat(v.replace(/[^\d,.]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'))||0;return(/%/.test(v)||(n>0&&n<=100))?{pct:n}:{m:Math.round(n)}};
const pend=svc=>D.watch.filter(w=>!w.visto&&w.svc&&w.svc===svc);
const pubPromos=svc=>{const sv=catS()[svc];return((sv&&sv.promos)||[]).filter(p=>!p.hasta||p.hasta>=today())};
const svcCorte=svc=>{const x=D.subs.find(z=>z.svc===svc&&z.baja&&subCorte(z));if(!x)return '';const f=subCorte(x);return f>=today()?f:''};
function subVencidas(){let ch=false;D.subs.forEach(x=>{if(x.rot&&x.baja&&x.alta&&today()>subCorte(x)){x.pausa=true;delete x.alta;delete x.baja;delete x.bajaSF;delete x.hasta;ch=true}});if(ch)save()}
function cheapest(svc){const sv=catS()[svc];if(!sv)return 0;const v=Object.values(sv.planes||{}).map(p=>toARS(+p.m||0,sv.mon)).filter(v=>v>0);return v.length?Math.min(...v):0}
const svcName=svc=>svc&&catS()[svc]?catS()[svc].n:(svc?svc:'Otra plataforma');

/* ===== series (TVmaze) ===== */
const TVM='https://api.tvmaze.com';
const NETMAP=[[/netflix/i,'netflix'],[/hbo|^max$/i,'hbo'],[/disney/i,'disney'],[/prime|amazon/i,'prime'],[/apple/i,'appletv'],[/crunchyroll/i,'crunchyroll'],[/paramount/i,'paramount'],[/star\+/i,'disney']];
const svcFromNet=n=>{for(const[r,id] of NETMAP)if(r.test(n||''))return catS()[id]?id:'';return ''};
/* Búsqueda por nombre en español (u otro idioma): Wikidata da el título traducido y el código de IMDb, y con ese código TVmaze devuelve la serie exacta */
const WD='https://www.wikidata.org/w/api.php?format=json&origin=*&';
const fetchT=(u,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||7000);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t))};
async function wdSearch(q){
  const r=await fetchT(WD+'action=wbsearchentities&type=item&limit=8&language=es&uselang=es&search='+encodeURIComponent(q));if(!r.ok)return[];
  const L=((await r.json()).search||[]);if(!L.length)return[];
  const e=await fetchT(WD+'action=wbgetentities&props=claims&ids='+L.map(x=>x.id).join('|'));if(!e.ok)return[];const ents=(await e.json()).entities||{};

   (L.length?L.map(({id,p})=>{const pv=pend(id).length,i=D.subs.findIndex(x=>x.svc===id);return '<div class="it"><div class="ith"><h3>'+esc(cs[id].n)+'</h3>'+(tengo(id)?'<span class="tag">La tenés</span>':'')+'</div><p style="margin:4px 0 0">'+esc(p.t)+'</p><p class="mut" style="margin:2px 0 0;font-size:14px">'+(p.quien?esc(p.quien)+' · ':'')+(p.hasta?'hasta el '+fDM(p.hasta):'sin fecha de fin publicada')+(pv?' · '+pl(pv,'título')+' para ver':'')+'</p><div class="acts">'+(i>=0?'<button class="btn sm" data-act="promouse" data-i="'+i+'" data-j="'+pubPromos(id).indexOf(p)+'">¿Me conviene?</button>':'')+(p.url?'<a class="btn ghost sm" href="'+esc(p.url)+'" target="_blank" rel="noopener">Ver la oferta</a>':'')+'</div></div>'}).join('')
     :'<p class="empty">No hay promos públicas vigentes por ahora.</p>')+'</div><div class="card"><h2>¿Te ofrecieron una promo al darte de baja?</h2><p class="hint" style="margin-top:6px">Cargala en Plataformas, dentro de esa suscripción, con “Me ofrecieron una promo”. Te digo si te conviene según lo que tenés para ver.</p><a class="btn ghost" href="#plataformas">Ir a Plataformas</a></div>'}

   '<div class="card"><h2>Acerca de</h2><p class="hint" style="margin-top:6px">Seriéfilos '+VERSION+'. Precios y promos de referencia para Argentina, revisados una vez por mes; pueden variar. Datos de series de TVmaze (CC BY-SA). “Mejor puntuadas”: datos y carátulas de TMDB; esta app usa la API de TMDB pero no está avalada ni certificada por TMDB. Disponibilidad en plataformas: JustWatch. Búsquedas en JustWatch. Seriéfilos no está afiliada a ninguna plataforma.</p><a class="btn ghost" href="https://aleknot696.github.io/Seriefilos/privacidad.html" target="_blank" rel="noopener">Política de privacidad</a></div>'}
const VIEWS={inicio:vInicio,plataformas:vPlataformas,paraver:vParaver,series:vSeries,promos:vPromos,ajustes:vAjustes};
function render(){
  $('#view').innerHTML=VIEWS[S.route]();
  document.querySelectorAll('nav.tabs a').forEach(x=>{if(x.dataset.r===S.route)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')})}

  if(d.ser!=null){const x=D.series[+d.ser];x.prox=Object.assign({temp:+x.ult+1,estado:'confirmada'},x.prox||{});x.prox.manual=true;if(d.f==='temp')x.prox.temp=pn(t.value);else if(t.value)x.prox[d.f]=t.value;else delete x.prox[d.f];if(x.prox.f)x.prox.estado='fecha';save();needR=true;return}});
V.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(needR&&!(a&&a.tagName==='INPUT'&&V.contains(a))){needR=false;render()}},0));
V.addEventListener('change',e=>{const t=e.target;if(t.dataset.imp!=null&&t.files[0]){const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);if(!j||j.app!=='seriefilos')throw 0;if(!await ask('¿Reemplazar tus datos por los de la copia?','Reemplazar'))return;D=Object.assign(D0(),j.datos);save();render();toast('Copia importada')}catch(x){toast('Ese archivo no es una copia de Seriéfilos')}};r.readAsText(t.files[0])}});
V.addEventListener('submit',async e=>{if(e.target.dataset.wa!=null){e.preventDefault();const q=S.wq.trim();if(!q){toast('Escribí un título');return}S.wsel=null;S.wman=false;S.wbusy=true;S.wres=null;render();try{S.wres=await tvmSearch(q)}catch(x){S.wres=[];toast('Sin conexión: podés agregarlo sin buscar')}S.wbusy=false;render();return}
  if(e.target.dataset.ss==null)return;e.preventDefault();const q=S.sq.trim();if(!q){toast('Escribí el nombre');return}
  S.sbusy=true;S.sres=null;render();try{S.sres=await tvmSearch(q)}catch(x){S.sres=null;toast('Sin conexión: probá de nuevo o cargala a mano');S.sbusy=false;S.sres=[];render();return}S.sbusy=false;render()});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.go){location.hash=d.go;return}
  if(!V.contains(b))return;
  if(d.delsub!=null){const x=D.subs[+d.delsub];if(!await ask('¿Quitar '+subInfo(x).n+'?','Quitar'))return;D.subs.splice(+d.delsub,1);save();render();return}
  if(d.delw!=null){D.watch.splice(+d.delw,1);save();render();return}
  if(d.unw!=null){D.watch[+d.unw].visto=false;save();render();return}
  if(d.delser!=null){const x=D.series[+d.delser];if(!await ask('¿Quitar “'+x.t+'”?','Quitar'))return;D.series.splice(+d.delser,1);save();render();return}
  if(d.wr!=null){const s=S.wres[+d.wr];S.wsel={name:s.name,id:s.id,img:s.image&&s.image.medium||'',svc:svcFromNet((s.webChannel&&s.webChannel.name)||(s.network&&s.network.name)),info:[s.premiered&&s.premiered.slice(0,4),(s.webChannel&&s.webChannel.name)||(s.network&&s.network.name)].filter(Boolean).join(' · ')};render();return}
  if(d.lr!=null){const x=D.watch.find(z=>z.id===S.det),s=S.lres[+d.lr];if(x&&s){x.tvm=s.id;x.img=s.image&&s.image.medium||'';x.tipo='Serie';delete x.nolink;if(!x.svc)x.svc=svcFromNet((s.webChannel&&s.webChannel.name)||(s.network&&s.network.name));S.lres=null;save();render();toast('Listo: ya podés seguir los capítulos')}return}
  if(d.wf!=null){S.wf=d.wf==='*'?null:d.wf;render();return}
  if(d.es!=null){S.dseas=+d.es;render();return}
  if(d.df!=null){S.df=d.df;S.terr=false;render();return}
  if(d.tadd!=null){const z=TOP&&TOP.it.find(q=>q.id===+d.tadd);if(z){b.disabled=true;topAdd(z,new Set(D.subs.filter(x=>x.svc).map(x=>x.svc)))}return}
  if(d.dadd!=null){const z=DESC&&DESC.it.find(q=>q.sid===+d.dadd);if(!z||D.watch.some(w=>w.tvm===z.sid))return;D.watch.push({id:uid(),t:z.n,svc:z.svc,tipo:'Serie',tvm:z.sid,img:z.img});save();render();toast('“'+z.n+'” agregada a tu lista');return}
  if(d.sr!=null){const s=S.sres[+d.sr];S.ssel={name:s.name,id:s.id,img:s.image&&s.image.medium||'',premiered:s.premiered,svc:svcFromNet((s.webChannel&&s.webChannel.name)||(s.network&&s.network.name)),temps:null,cargando:true};S.sult='1';render();
    const sel=S.ssel;serTemps(s.id).then(n=>{sel.temps=n;if(n)S.sult=String(n)}).catch(()=>{}).finally(()=>{sel.cargando=false;if(S.ssel===sel)render()});return}
  const C=D;switch(d.act){
    case 'introx':D.intro=false;save();render();break;
    case 'notifs':askNotifs();break;
    case 'addsub':{if(S.ns==='otra'){if(!S.nc.n.trim()){toast('Poné el nombre');break}const v=S.nc.mon==='USD'?(parseFloat(String(S.nc.m).replace(',','.'))||0):pn(S.nc.m);C.subs.push({n:S.nc.n.trim(),m:v,mon:S.nc.mon});S.nc={n:'',m:'',mon:'ARS'}}
      else{if(C.subs.some(x=>x.svc===S.ns)&&!await ask('Ya tenés '+catS()[S.ns].n+'. ¿Agregarla igual?','Agregar'))break;C.subs.push({svc:S.ns,plan:S.np})}D.intro=false;save();render();toast('Plataforma agregada');break}
    case 'subact':{const x=C.subs[+d.i];delete x.pausa;delete x.hasta;x.alta=today();delete x.baja;delete x.bajaSF;save();render();toast('Activada: acordate de darte de baja hoy');break}
    case 'subbaja':{const x=C.subs[+d.i];x.baja=true;if(!x.alta)x.alta=today();S.bj={i:+d.i,f:subCorte(x)};save();if(S.route!=='plataformas')location.hash='plataformas';else render();toast('Confirmá hasta qué fecha la ves');break}
    case 'subpausa':{const x=C.subs[+d.i];if(!await ask('¿Ya la diste de baja? Desde el mes que viene no se cuenta.','Sí, la di de baja'))break;const n=new Date();x.alta=ymd(new Date(n.getFullYear(),n.getMonth(),1));x.baja=true;x.bajaSF=true;delete x.hasta;S.bj={i:+d.i,f:''};save();render();break}
    case 'bjopen':{const x=C.subs[+d.i];S.bj={i:+d.i,f:x.hasta||(x.bajaSF?'':subCorte(x))};render();break}
    case 'bjsave':{const x=C.subs[+d.i],f=S.bj&&S.bj.f;if(f&&/^\d{4}-\d{2}-\d{2}$/.test(f))x.hasta=f;else delete x.hasta;S.bj=null;save();render();toast(x.hasta?'La ves hasta el '+fDM(x.hasta)+'. Te aviso antes.':'Sin fecha exacta');break}
    case 'bjskip':S.bj=null;render();break;
    case 'promoopen':S.pf={i:+d.i,v:'',n:'',desde:nowK(),nota:''};render();break;
    case 'promouse':{const x=C.subs[+d.i],p=pubPromos(x.svc)[+d.j];if(!p)break;S.pf={i:+d.i,v:p.pct?p.pct+'%':String(p.m||''),n:String(p.meses||''),desde:nowK(),nota:'Promo pública: '+p.t};if(S.route!=='plataformas')location.hash='plataformas';else render();break}
    case 'promocancel':S.pf=null;render();break;
    case 'promosave':{const x=C.subs[+d.i],P=S.pf,n=pn(P&&P.n),pr=pfParse(P&&P.v);if(!n||!(pr.pct||pr.m)){toast('Completá descuento y meses');break}
      x.promo=Object.assign(pr,{meses:n,desde:P.desde||nowK(),nota:P.nota||''});delete x.pausa;delete x.alta;delete x.baja;delete x.bajaSF;delete x.hasta;S.pf=null;save();render();toast('Promo guardada hasta '+labS(promoFin(x)));break}
    case 'promodel':{const x=C.subs[+d.i];if(!await ask('¿Quitar la promo de '+subInfo(x).n+'?','Quitar'))break;delete x.promo;save();render();break}
    case 'addw':{if(!S.nw.t.trim()){toast('Poné el título');break}C.watch.push({id:uid(),t:S.nw.t.trim(),svc:S.nw.svc,tipo:S.nw.tipo});S.nw={t:'',svc:S.nw.svc,tipo:'Película'};S.wman=false;S.wres=null;S.wq='';save();render();toast('Agregado a “Para ver”');break}
    case 'wmanual':S.wman=true;S.nw={t:S.wq.trim(),svc:S.nw.svc||'',tipo:'Película'};S.wres=null;render();break;
    case 'wcancel':S.wman=false;S.wsel=null;S.wres=null;render();break;
    case 'wadd':{const s=S.wsel;if(!s)break;if(C.watch.some(w=>w.tvm===s.id&&!w.visto)){toast('Ya está en tu lista');break}const x={id:uid(),t:s.name,svc:s.svc||'',tipo:'Serie',tvm:s.id,img:s.img};C.watch.push(x);S.wsel=null;S.wres=null;S.wq='';save();render();toast('“'+s.name+'” agregada');epLoad(x.tvm).then(e=>{progUpd(x,e);x.progd=today();save();render()}).catch(()=>{});break}
    case 'epnext':{const x=C.watch.find(z=>z.id===S.det),E=x&&EPC[x.tvm];if(!E)break;const v=new Set(x.vistos||[]),nx=aired(E.e).find(e=>!v.has(e.id));if(!nx)break;v.add(nx.id);x.vistos=[...v];progUpd(x,E.e);x.progd=today();S.dseas=null;save();render();toast('T'+nx.s+'E'+nx.n+' vista');break}
    case 'epseason':{const x=C.watch.find(z=>z.id===S.det),E=x&&EPC[x.tvm];if(!E)break;const v=new Set(x.vistos||[]);aired(E.e).filter(e=>e.s===+d.s).forEach(e=>v.add(e.id));x.vistos=[...v];progUpd(x,E.e);x.progd=today();save();render();break}

    case 'wlink':{const x=C.watch.find(z=>z.id===S.det);if(!x)break;S.lbusy=true;render();try{S.lres=await tvmSearch(x.t.replace(/\s*\(T\d+\)$/,''))}catch(err){S.lres=[];toast('Sin conexión')}S.lbusy=false;render();break}
    case 'infretry':if(S.info){delete INF[S.info.k+S.info.id];render()}break;
    case 'dretry':S.derr=false;S.terr=false;descLoad();render();break;
    case 'saddopen':S.sadd=true;render();break;
    case 'saddclose':S.sadd=false;S.sres=null;render();break;

    case 'sercancel':S.ssel=null;render();break;
    case 'seradd':{const s=S.ssel;if(!s.name.trim()){toast('Poné el nombre');break}const x={id:uid(),t:s.name,svc:s.svc||'',ult:Math.max(1,pn(S.sult)||1),tvm:s.id||null,img:s.img||'',prox:null};C.series.push(x);S.ssel=null;S.sres=null;S.sq='';S.sadd=false;save();render();
      if(x.tvm){try{await serCheck(x);save();render()}catch(err){}}toast('Agregada');break}
    case 'serref':toast('Revisando…');serRefresh(true);break;
    case 'sertow':{const x=C.series[+d.i],P=x.prox||{},tp=P.temp||+x.ult+1;C.watch.push({id:uid(),t:x.t+' (T'+tp+')',svc:x.svc,tipo:'Serie',tvm:x.tvm||null,img:x.img||''});x.ult=tp;x.prox=null;delete x.chk;save();render();toast('En “Para ver”. Queda en espera de la T'+(tp+1));if(x.tvm)serCheck(x).then(()=>{save();render()}).catch(()=>{});break}
    case 'exp':{const txt=JSON.stringify({app:'seriefilos',version:1,exportado:new Date().toISOString(),datos:D},null,1),nom='seriefilos-copia-'+today()+'.json';
      if(NAT){/* En Android: se guarda en la app y se abre "Compartir" para mandarla a Drive, mail, WhatsApp o Archivos */
        try{const w=await NAT.FS.writeFile({path:nom,data:txt,directory:'CACHE',encoding:'utf8'});
          try{await NAT.SH.share({title:'Copia de Seriéfilos',text:'Copia de mis datos de Seriéfilos ('+today()+')',files:[w.uri],dialogTitle:'Guardar o enviar la copia'})}catch(x){if(!/cancel/i.test(String(x&&x.message||x)))throw x;break}
          toast('Copia lista')}catch(x){try{await navigator.clipboard.writeText(txt);toast('No se pudo crear el archivo: la copia quedó en el portapapeles')}catch(y){toast('No se pudo exportar la copia')}}
        break}
      const blob=new Blob([txt],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nom;document.body.append(a);a.click();a.remove();
